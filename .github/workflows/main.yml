name: Build Kyoto VST3 Quick Host
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "build/KyotoVST3QuickHost_artefacts/Release/*" package -Recurse -Force
          Compress-Archive -Path package/* -DestinationPath KyotoVST3QuickHost-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KyotoVST3QuickHost-Windows
          path: KyotoVST3QuickHost-Windows.zip
