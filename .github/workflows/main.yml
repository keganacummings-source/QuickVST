name: Build Kyoto VST3 Quick Builder

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify toolchain
        shell: pwsh
        run: |
          where.exe cl.exe
          cl.exe 2>&1 | Select-Object -First 3
          cmake --version
          ninja --version

      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: C:\kyoto-juce-cache
          key: juce-8.0.6-windows-msvc-x64-v3

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DFETCHCONTENT_BASE_DIR=C:/kyoto-juce-cache

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel $env:NUMBER_OF_PROCESSORS

      - name: Locate EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter "*Quick Builder.exe" |
            Select-Object -First 1
          if (-not $exe) { throw "Kyoto VST3 Quick Builder.exe was not produced." }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $exe.FullName release\KyotoVST3QuickBuilder.exe

      - name: Package
        shell: pwsh
        run: |
          @"
          Kyoto VST3 Quick Builder
          Windows x64 / MSVC / JUCE 8.0.6

          BUILD MODE:
          Drop an extracted GitHub/CMake VST3 project folder.
          The app configures, compiles, caches the VST3 and launches it.

          PLAYER MODE:
          Turn BUILD MODE off and drop a Windows .vst3 folder.
          "@ | Set-Content release\README.txt
          Compress-Archive -Path release\* `
            -DestinationPath KyotoVST3QuickBuilder-Windows-x64.zip -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KyotoVST3QuickBuilder-Windows-x64
          path: release/*

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KyotoVST3QuickBuilder-Windows-x64-ZIP
          path: KyotoVST3QuickBuilder-Windows-x64.zip
